<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RogueFA — Automated Broadcast Aggregation</title>
    <meta name="description" content="RogueFA (Automated Broadcast Aggregation) provides structured daily broadcast digests, top pick hit rates, and public media aggregation for North American equities. Free, privacy-friendly, no account required." />
    <meta name="theme-color" content="#1E1F22" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />

    <!-- OpenGraph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RogueFA" />
    <meta property="og:title" content="RogueFA — Automated Broadcast Aggregation" />
    <meta property="og:description" content="Daily broadcast digests, verified top pick hit rates, and deterministic broadcast aggregation for North American equities." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://roguefa.ai" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RogueFA — Automated Broadcast Aggregation" />
    <meta name="twitter:description" content="Daily broadcast digests, verified top pick hit rates, and deterministic broadcast aggregation for North American equities." />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', '"Roboto Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'sans-serif'],
            },
            borderRadius: {
              '2xl': '16px',
            },
            colors: {
              surface: {
                DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
                card: 'rgb(var(--c-surface-card) / <alpha-value>)',
                elevated: 'rgb(var(--c-surface-elevated) / <alpha-value>)',
              },
              edge: 'rgb(var(--c-edge) / <alpha-value>)',
              prime: 'rgb(var(--c-prime) / <alpha-value>)',
              dim: 'rgb(var(--c-dim) / <alpha-value>)',
              faint: 'rgb(var(--c-faint) / <alpha-value>)',
              accent: {
                DEFAULT: 'rgb(var(--c-accent) / <alpha-value>)',
                hover: 'rgb(var(--c-accent-hover) / <alpha-value>)',
                muted: 'rgb(var(--c-accent-muted) / <alpha-value>)',
                text: 'rgb(var(--c-accent-text) / <alpha-value>)',
              },
              'signal-buy': 'rgb(var(--c-signal-buy) / <alpha-value>)',
              'signal-watch': 'rgb(var(--c-signal-watch) / <alpha-value>)',
              'signal-avoid': 'rgb(var(--c-signal-avoid) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
            },
            boxShadow: {
              'antigravity': '0 2px 10px rgba(0, 0, 0, 0.24)',
              'antigravity-hover': '0 6px 24px rgba(0, 0, 0, 0.35)',
              'antigravity-elevated': '0 8px 32px rgba(0, 0, 0, 0.45)',
            },
          },
        },
      };
    </script>
    <style>
      /* Pre-React background to prevent flash */
      body { background-color: #1E1F22; color: #E3E3E3; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body class="font-sans antialiased bg-surface text-prime">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
